services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: adaptive_pm
      POSTGRES_PASSWORD: adaptive_pm
      POSTGRES_DB: adaptive_pm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  pgdata:
